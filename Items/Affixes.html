<h1>词缀</h1>
<p>&nbsp;</p>
<p>以下列出了各类物品属性及其运作原理的说明，一些显而易见、无需多做解释的属性未包含在内。</p>
<p>&nbsp;</p>
<figure class="table" style="float:left;">
  <table>
    <thead>
      <tr>
        <th>词缀</th>
        <th>说明</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>你感到自己变得虚无缥缈...</td>
        <td>为角色附加一种淡出/半透明的视觉效果</td>
      </tr>
      <tr>
        <td>亡者安息</td>
        <td>防止已死亡的怪物被敌方复活或用于诸如尸体爆炸之类的技能（例如尼拉塞克）</td>
      </tr>
      <tr>
        <td>+x 技能等级（未注明职业或充能次数）</td>
        <td>
          <p>使任何职业穿戴该物品后都能获得对应技能。</p>
          <p>例如：<i> +1 敏锐感知（Dodge）</i>（斥候符文之语）可以让你的角色或佣兵都获得亚马逊的“敏锐感知”技能效果。</p>
        </td>
      </tr>
      <tr>
        <td>x级带充能次数的技能</td>
        <td>使任何职业穿戴该物品后都能获得对应技能，但使用次数受充能次数限制。充能次数可以通过修理物品来恢复。</td>
      </tr>
      <tr>
        <td>加快恢复速度（Faster Hit Recovery，FHR）&nbsp;</td>
        <td>
          <p>提升受击后的恢复速度。以帧数衡量，每个职业/佣兵的基础恢复帧数各不相同。&nbsp;</p>
          <p>只有当总 FHR% 跨越对应的分段点（使恢复动作减少1帧/提升速度所需的总FHR%）时，效果才会真正提升。&nbsp;</p>
        </td>
      </tr>
      <tr>
        <td>加快施法速度（Faster Cast Rate，FCR）&nbsp;</td>
        <td>
          <p>提升施法速度。以帧数衡量，每个职业/佣兵（三幕佣兵）的基础施法帧数各不相同。&nbsp;</p>
          <p>只有当总 FCR% 跨越对应的分段点（使施法动作减少1帧/提升速度所需的总FCR%）时，效果才会真正提升。&nbsp;</p>
        </td>
      </tr>
      <tr>
        <td>加快格挡速度（Faster Block Rate，FBR）</td>
        <td>
          <p>提升格挡速度。以帧数衡量，每个职业的基础格挡帧数各不相同。&nbsp;</p>
          <p>只有当总 FBR% 跨越对应的分段点（使格挡动作减少1帧/提升速度所需的总FBR%）时，效果才会真正提升。&nbsp;</p>
        </td>
      </tr>
      <tr>
        <td>百分比受到伤害转化为魔法值</td>
        <td>
          <p>将所受伤害的一定百分比转化为魔法值回复。&nbsp;</p>
          <p>不会减少实际受到的伤害。</p>
        </td>
      </tr>
      <tr>
        <td>防止怪物自愈</td>
        <td>防止怪物自然恢复生命值。怪物仍可以被治疗类法术治愈。</td>
      </tr>
      <tr>
        <td>百分比撕裂伤口几率</td>
        <td>
          <p>施加一种流血类修正效果，对怪物造成持续伤害。&nbsp;</p>
          <p>伤害会随玩家等级成长（原版中约为8秒内造成2000点伤害左右，D2RR 中是否有调整待定）</p>
          <p>对Boss效果减半。</p>
          <p>对PVP效果为四分之一。</p>
          <p>远程攻击应用的比例是上述数值的一半。</p>
        </td>
      </tr>
      <tr>
        <td>百分比致命打击（Deadly Strike）</td>
        <td>
          <p>有几率造成双倍伤害。&nbsp;</p>
          <p>会在其他修正/加成之上额外生效，但不会与暴击等类似技能叠加。</p>
        </td>
      </tr>
      <tr>
        <td>百分比压碎打击（Crushing Blow）</td>
        <td>
          <p>有几率削减怪物一定比例的生命值。</p>
          <p>比例为：对普通怪物25%，对Boss12.5%，对玩家10%。</p>
          <p>远程攻击的比例为上述数值的一半。</p>
        </td>
      </tr>
      <tr>
        <td>元素/魔法吸收</td>
        <td>
          <p>按指定百分比降低所受伤害，并将被吸收的数值转化为治疗效果。</p>
          <p>在抗性等伤害减免类修正之后生效。</p>
        </td>
      </tr>
      <tr>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
      </tr>
      <tr>
        <td>待补充</td>
        <td>…</td>
      </tr>
    </tbody>
  </table>
</figure>
